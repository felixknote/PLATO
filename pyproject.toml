[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plato-browser"
version = "0.1.0"
description = "PLATO - PLATe Overview: a plate-map-aware image browser for high-content phenotypic screening"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "tifffile>=2024.1.30",
    "imagecodecs>=2024.1.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13"]
# The Embedding Explorer only. Kept out of `gui` so the plate browser still
# installs without a compiler toolchain for umap-learn's numba dependency.
embed = ["scikit-learn>=1.4", "umap-learn>=0.5", "openTSNE>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
plato = "plato.cli:main"

[tool.setuptools.packages.find]
include = ["plato*"]

[tool.setuptools.package-data]
"plato.gui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
